# Production same-origin entry point for the Vue SPA and Spring Boot API.
# Replace the example domain and certificate paths before enabling this file.

# Shared-memory limits are keyed by the direct client address seen at this
# trusted edge. If a CDN or load balancer is added, configure real_ip first.
limit_req_zone $binary_remote_addr zone=after_school_login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=after_school_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=after_school_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name after-school.example;

    # Keep all browser traffic on HTTPS; 308 also preserves non-GET methods.
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name after-school.example;

    ssl_certificate     /etc/letsencrypt/live/after-school.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/after-school.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    limit_conn after_school_connections 40;
    limit_conn_status 429;
    limit_req_status 429;
    limit_req_log_level warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # current is an atomically replaced symlink to one immutable Vite release.
    root /var/www/after-school-service/current;
    index index.html;
    autoindex off;

    # Login gets a deliberately tight edge limit in addition to the bounded
    # in-process account/source backoff in Spring Security.
    location = /api/auth/login {
        limit_req zone=after_school_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the first trusted proxy boundary. Overwrite, rather than
        # append, so a client-supplied X-Forwarded-For cannot reach Tomcat.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No trailing slash on proxy_pass: the complete /api/... URI is preserved.
    # The application currently has no WebSocket endpoint, so no Upgrade tunnel
    # headers are required.
    location ^~ /api/ {
        limit_req zone=after_school_api burst=60 nodelay;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the first trusted proxy boundary. Overwrite, rather than
        # append, so a client-supplied X-Forwarded-For cannot reach Tomcat.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator and main-port probes are intentionally local-only. Production
    # monitoring reads 127.0.0.1 directly and never traverses the public edge.
    location ^~ /actuator/ {
        return 404;
    }
    location = /livez {
        return 404;
    }
    location = /readyz {
        return 404;
    }

    # Never serve hidden files or common source/configuration artifacts if they
    # are copied into the document root by mistake.
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }
    location ~* ^/(?:deploy|node_modules|scripts|src|target)(?:/|$) {
        deny all;
    }
    location ~* ^/(?:package(?:-lock)?\.json|pom\.xml|tsconfig(?:\.[^/]+)?\.json|vite\.config\.[^/]+)$ {
        deny all;
    }
    location ~* \.(?:bak|conf|env|ini|log|map|sql|sqlite|swp|toml|ya?ml)$ {
        deny all;
    }

    # Production builds use /releases/<id>/ as their Vite base. Keeping old
    # release directories for a grace period lets already-open tabs continue to
    # lazy-load their original hashed chunks after a deployment.
    location /releases/ {
        root /var/www/after-school-service;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Nginx versions shipped by Ubuntu 24.04 do not merge add_header values
        # from the server block once a location defines Cache-Control.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    # Vue Router uses HTML5 history, so application routes fall back to the SPA.
    # HTML and route responses must revalidate so a fresh navigation sees the
    # atomically selected release rather than a stale index document.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }
}
