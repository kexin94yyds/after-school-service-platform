server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: "127.0.0.1/32, ::1/128"
  servlet:
    session:
      cookie:
        secure: true

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    out-of-order: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  rectification:
    storage-path: ${RECTIFICATION_MATERIAL_DIR:/var/lib/after-school-service/rectification-materials}

management:
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_SERVER_PORT:8082}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
