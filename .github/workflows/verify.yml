name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Full application and operations verification
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: after-school-service-web/package-lock.json

      - name: Install verification tools
        run: brew install mysql@8.4 jq flock

      - name: Install Chromium for browser E2E
        working-directory: after-school-service-web
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npx playwright install chromium

      - name: Run full isolated verification
        env:
          AFTER_SCHOOL_VERIFY_SERVER_PORT: "18083"
          AFTER_SCHOOL_VERIFY_MANAGEMENT_PORT: "18084"
          AFTER_SCHOOL_VERIFY_MYSQL_PORT: "18308"
          AFTER_SCHOOL_VERIFY_WEB_PORT: "15174"
        run: |
          export AFTER_SCHOOL_MYSQL84_HOME="$(brew --prefix mysql@8.4)"
          ./scripts/verify.sh

      - name: Upload executable JAR and SBOM
        uses: actions/upload-artifact@v7
        with:
          name: backend-artifacts
          if-no-files-found: error
          path: |
            after-school-service-server/target/after-school-service-server-*.jar
            !after-school-service-server/target/*.original
            after-school-service-server/target/classes/META-INF/sbom/application.cdx.json

  backend-supply-chain:
    name: Backend known-vulnerability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test, generate SBOM and scan dependencies
        working-directory: after-school-service-server
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn --batch-mode --no-transfer-progress clean verify -Psecurity

      - name: Upload supply-chain reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-supply-chain-reports
          if-no-files-found: warn
          path: |
            after-school-service-server/target/classes/META-INF/sbom/application.cdx.json
            after-school-service-server/target/dependency-check-report.html
            after-school-service-server/target/dependency-check-report.json
